name: Build iPhone IPA for SideStore

on:
  workflow_dispatch:
    inputs:
      enable_telegram_login:
        description: Embed your Telegram API credentials in the downloadable IPA
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    env:
      APP_BUNDLE_ID: org.chatlab.ios
    steps:
      - name: Check out the build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Telegram API credentials
        if: inputs.enable_telegram_login
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if ! [[ "$TELEGRAM_API_ID" =~ ^[1-9][0-9]*$ && "$TELEGRAM_API_HASH" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo '::error::Set TELEGRAM_API_ID and TELEGRAM_API_HASH in the repository Actions secrets (my.telegram.org/apps).'
            exit 1
          fi

      - name: Check out Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: 24638bc69bd083981b178dd1e7f921eebbf7fc46
          path: telegram-ios
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode and free disk space
        working-directory: telegram-ios
        run: |
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          selected="/Applications/Xcode_${version}.app"
          if [[ ! -d "$selected" ]]; then
            echo "::error::Xcode $version is unavailable on this runner."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          selected=$(cd "$selected" && pwd -P)
          sudo xcode-select --switch "$selected/Contents/Developer"
          if [[ -L /Applications/Xcode.app ]]; then
            sudo ln -sfn "$selected" /Applications/Xcode.app
          fi
          for xcode in /Applications/Xcode_*.app; do
            if [[ -d "$xcode" && ! -L "$xcode" && "$xcode" != "$selected" ]]; then
              sudo rm -rf "$xcode"
            fi
          done
          xcodebuild -version
          df -h .

      - name: Configure the SideStore build
        working-directory: telegram-ios
        env:
          ENABLE_TELEGRAM_LOGIN: ${{ inputs.enable_telegram_login }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          tools="$GITHUB_WORKSPACE/.github"
          mkdir -p Telegram/Telegram-iOS/ChatLab.xcassets
          cp -R "$tools/ios-assets/ChatLab.appiconset" Telegram/Telegram-iOS/ChatLab.xcassets/
          python3 "$tools/scripts/prepare-sidestore.py"
          cat >> .bazelrc <<'BAZELRC'

          build --//Telegram:disableProvisioningProfiles
          build --//Telegram:disableExtensions
          build --features=disable_legacy_signing
          BAZELRC

      - name: Compile the device IPA
        working-directory: telegram-ios
        run: |
          python3 -u build-system/Make/Make.py build \
            --configurationPath="$RUNNER_TEMP/telegram-sidestore.json" \
            --xcodeManagedCodesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER"

      - name: Check the IPA payload
        working-directory: telegram-ios
        run: |
          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          ipa=bazel-bin/Telegram/Telegram.ipa
          check_dir=$(mktemp -d "$RUNNER_TEMP/ipa-check.XXXXXX")
          trap 'rm -rf -- "$check_dir"' EXIT

          [[ -f "$ipa" ]] || fail "The build did not produce $ipa."
          unzip -q "$ipa" -d "$check_dir" || fail "Could not extract $ipa."

          app="$check_dir/Payload/Telegram.app"
          plist="$app/Info.plist"
          [[ -f "$plist" ]] || fail "Payload/Telegram.app/Info.plist is missing."
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist") ||
            fail "The app bundle identifier is missing."
          [[ "$bundle_id" == "$APP_BUNDLE_ID" ]] ||
            fail "Unexpected bundle identifier: $bundle_id (expected $APP_BUNDLE_ID)."
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist") ||
            fail "The app executable name is missing from Info.plist."
          [[ -n "$executable" && -f "$app/$executable" ]] ||
            fail "The app executable is missing from the payload."
          [[ ! -e "$app/PlugIns" ]] || fail "The IPA contains app extensions."
          [[ ! -e "$app/embedded.mobileprovision" ]] ||
            fail "The IPA contains an embedded provisioning profile."
          archs=$(lipo -archs "$app/$executable") || fail "Could not read the app executable architectures."
          [[ "$archs" == arm64 ]] || fail "Unexpected app executable architectures: $archs (expected arm64)."
          build_info=$(xcrun vtool -show-build "$app/$executable") ||
            fail "Could not read the app executable platform."
          grep -Eq '^[[:space:]]*platform[[:space:]]+IOS[[:space:]]*$' <<< "$build_info" ||
            fail "The app executable does not target iOS devices."

          cp "$ipa" "$RUNNER_TEMP/ChatLab-SideStore.ipa"
          {
            printf '### SideStore IPA payload\n\n'
            printf -- '- Workflow run: #%s (attempt %s)\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Bundle identifier: `%s`\n' "$bundle_id"
            printf -- '- Executable: `%s` for iOS devices (`%s`)\n' "$executable" "$archs"
            printf -- '- App extensions and embedded provisioning profile: absent\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatLab-SideStore
          path: ${{ runner.temp }}/ChatLab-SideStore.ipa
          if-no-files-found: error
          retention-days: 3
